name: "Database Ingest Workflow"

on:
  workflow_dispatch:
    inputs:
      config-path:
        description: "Config YAML path"
        required: false
        default: "config/config.yaml"
      output-dir:
        description: "Output directory for raw files"
        required: false
        default: ""
      buyrent-max-pages:
        description: "Limit BuyRentKenya pages"
        required: false
        default: ""
      buyrent-no-details:
        description: "Skip BuyRentKenya detail pages"
        required: false
        default: "false"
      buyrent-listing-type:
        description: "BuyRentKenya listing type"
        required: false
        default: "houses"
      prop24-max-pages:
        description: "Limit Property24 pages"
        required: false
        default: ""
      prop24-no-details:
        description: "Skip Property24 detail pages"
        required: false
        default: "false"
      verbose:
        description: "Enable verbose logging"
        required: false
        default: "false"

jobs:
  run-db-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run DB ingestion action
        uses: ./.github/actions/run-db-ingest
        with:
          config-path: ${{ github.event.inputs.config-path }}
          output-dir: ${{ github.event.inputs.output-dir }}
          buyrent-max-pages: ${{ github.event.inputs.buyrent-max-pages }}
          buyrent-no-details: ${{ github.event.inputs.buyrent-no-details }}
          buyrent-listing-type: ${{ github.event.inputs.buyrent-listing-type }}
          prop24-max-pages: ${{ github.event.inputs.prop24-max-pages }}
          prop24-no-details: ${{ github.event.inputs.prop24-no-details }}
          verbose: ${{ github.event.inputs.verbose }}
        env:
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
